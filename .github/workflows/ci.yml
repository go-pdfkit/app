name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: Build + test + exact 100% coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Test with coverage
        run: go test -covermode=set -coverprofile=coverage.out ./...

      # The lane the browser check never had. It vetted and built, and nothing
      # ran a test in it -- because it had none, which is how its reply table
      # came to be read and written from two goroutines under a comment saying
      # the mutex existed to stop exactly that. -race is the point of the step:
      # the sequential checks it drives would never open the window.
      - name: The browser check builds, vets and races too
        working-directory: browsercheck
        # ⛔ CGO for this step ALONE. The workflow sets CGO_ENABLED=0 for
        # everything, which is right for what it ships — and -race is built on
        # the cgo runtime, so the first version of this step failed outright:
        # "-race requires cgo; enable cgo by setting CGO_ENABLED=1". It had
        # passed locally, where no such variable was set. A lane is only
        # equivalent to the one in CI when its ENVIRONMENT is too.
        env:
          CGO_ENABLED: "1"
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
          go test -race -count=1 ./...

      - name: Assert exact 100% statement coverage
        run: |
          go tool cover -func=coverage.out | tail -n +1 > /tmp/cov.txt
          below=$(go tool cover -func=coverage.out | awk '$3 != "100.0%"')
          if [ -n "$below" ]; then
            echo "::error::coverage below 100%"
            echo "$below"
            exit 1
          fi
          echo "all statements covered (100.0%)"

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::not gofmt'd"; echo "$out"; exit 1; fi

      - name: Build the browser program
        run: |
          GOOS=js GOARCH=wasm go build -o web/main.wasm .
          ls -l web/main.wasm

      - name: The offline shell is complete
        run: |
          # The service worker caches this list; if a file it names is not
          # here the app installs and then fails to start with no network.
          for f in index.html sw.js manifest.webmanifest wasm_exec.js main.wasm; do
            test -s "web/$f" || { echo "::error::web/$f is missing or empty"; exit 1; }
          done

      - name: Type-check everywhere the fleet builds
        run: |
          # The program itself only has a main() under js/wasm, so the other
          # targets are type-checked rather than linked.
          for arch in amd64 arm64 riscv64 loong64 ppc64le s390x; do
            echo "== linux/$arch =="
            GOOS=linux GOARCH=$arch go vet ./...
          done
          GOOS=darwin  GOARCH=arm64 go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...

  browser:
    name: Drive it in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          check-latest: true
          cache: true

      - name: Build the browser program
        run: GOOS=js GOARCH=wasm go build -o web/main.wasm .

      - name: Find a browser
        run: |
          for c in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v $c >/dev/null; then echo "CHROME=$(command -v $c)" >> "$GITHUB_ENV"; fi
          done
          if [ -z "${CHROME:-}" ] && ! grep -q CHROME "$GITHUB_ENV"; then
            sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser
            echo "CHROME=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          fi

      # ⛔ AT BOTH PIXEL RATIOS. Headless Chrome runs at 1 unless told
      # otherwise, so for as long as this ran once it could only ever see the
      # display nobody has a problem with — and the workbench came out at half
      # the size it should be on every Retina screen while this stayed green.
      # ⛔⛔ AND IN BOTH COLOUR SCHEMES, WHICH IS THE SAME LESSON A SECOND TIME.
      # Headless Chrome reports whatever the machine reports, so these runs saw
      # the display of whoever started them — and these runners are light. Two
      # defects came of it: the page-arrival check asked for MORE ink than the
      # empty band had, which is only true when the paper is lighter than what
      # is behind it, so it could not run on a dark display at all; and the
      # theme gate asserted its FIRST transition and reported a defect twice
      # about working code. Both were a check that knew one theme.
      #
      # The browser is now TOLD which scheme to report, and told both. Proved
      # by putting the old light-only assumption back: the light run passed and
      # the dark run failed with "the document never appeared where the page is
      # drawn".
      - name: Open a PDF in it and save one back out, on an ordinary display
        working-directory: browsercheck
        # The runner has no user namespaces to sandbox the renderer in, and
        # the only page this browser ever loads is the one the check serves
        # itself.
        env:
          CHROME_NO_SANDBOX: "1"
        run: go run . ../web "" /tmp/browsercheck-light.png 1 light

      - name: The same with the browser reporting a dark colour scheme
        working-directory: browsercheck
        env:
          CHROME_NO_SANDBOX: "1"
        run: go run . ../web "" /tmp/browsercheck-dark.png 1 dark

      - name: The same on a Retina display
        working-directory: browsercheck
        env:
          CHROME_NO_SANDBOX: "1"
        run: go run . ../web "" /tmp/browsercheck-2x.png 2 light

      # ⛔ The two dimensions are crossed in full rather than sampled: the
      # Retina run is the slow one, where a page is four times the pixels and a
      # check that waits on a repaint has the least slack — so it is the run
      # most likely to show what the others hide.
      - name: The same on a Retina display, dark
        working-directory: browsercheck
        env:
          CHROME_NO_SANDBOX: "1"
        run: go run . ../web "" /tmp/browsercheck-2x-dark.png 2 dark
