# Publish the workbench, so that "it runs in a browser tab" is something a
# person can try rather than something a README says.
name: deploy-pages

on:
  push:
    branches: [main]
  # On a pull request too: the build job runs and the deploy job does not, so a
  # change that breaks the wasm build is caught before it lands rather than
  # after the published app stops working.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

# Deploys serialise under one group; a pull request gets its own, so it neither
# waits behind a deploy nor holds one up.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # ⛔ The WHOLE history, because the status line says `git describe`
          # and describe needs the TAGS. The default checkout is one commit
          # deep with none of them, and describe would fail — or, worse, be
          # made to not fail and print something that is not a version.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # Pinned, not `stable`. wasm_exec.js is copied out of the toolchain
          # below and MUST match the compiler that built the binary beside it;
          # an unpinned toolchain changes both with no commit to point at.
          go-version: '1.27.3'

      - name: Build the wasm binary, with the version it is built from in it
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: "0"
        run: |
          v=$(git describe --tags --always --dirty)
          echo "building $v"
          go build -trimpath -ldflags="-s -X main.release=$v" -o web/main.wasm .

      - name: The binary says which build it is
        # ⛔ THIS STEP IS THE POINT OF THE ONE ABOVE. A -X flag naming a
        # variable that no longer exists is accepted in SILENCE: the build
        # succeeds and the string is simply absent, and the status line goes
        # back to saying nothing without a single red mark anywhere. Renaming
        # main.release now fails the deploy instead.
        run: |
          v=$(git describe --tags --always --dirty)
          if ! grep -qa -- "$v" web/main.wasm; then
            echo "::error::web/main.wasm does not carry the version $v -- does -X still name a variable that exists?"
            exit 1
          fi
          echo "web/main.wasm says it is $v"

      - name: Take wasm_exec.js from the same toolchain
        # ⛔ Not vendored. The file is the runtime shim for the compiler that
        # produced main.wasm, and a copy committed months ago silently stops
        # matching. Go moved it from misc/wasm to lib/wasm, so both are tried
        # and a miss is an error rather than an empty file.
        run: |
          root=$(go env GOROOT)
          for p in "$root/lib/wasm/wasm_exec.js" "$root/misc/wasm/wasm_exec.js"; do
            if [ -f "$p" ]; then cp "$p" web/wasm_exec.js; echo "took $p"; exit 0; fi
          done
          echo "::error::no wasm_exec.js in $root"; exit 1

      - name: Say how big it came out
        # The number a visitor pays on first load, in the log, so a change that
        # doubles it is visible in the pull request that made it.
        run: |
          raw=$(wc -c < web/main.wasm)
          gz=$(gzip -9 -c web/main.wasm | wc -c)
          printf 'main.wasm %.1f MB raw, %.1f MB gzipped\n' \
            "$(echo "$raw/1048576" | bc -l)" "$(echo "$gz/1048576" | bc -l)"

      # ⛔ NOT `enablement: true`. It fails on a pull request with
      # "Create Pages site failed: Resource not accessible by integration":
      # creating the site is a repository-administration call, and the token a
      # workflow gets cannot make it. Pages is turned on once, out of band
      # (`gh api -X POST repos/go-pdfkit/playground/pages -f build_type=workflow`),
      # which is what the landing repository already does.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    # Only main publishes. A pull request stops after the build: it has proved
    # the app still compiles to wasm, which is the point of the gate, and it
    # has no business replacing what is served.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
